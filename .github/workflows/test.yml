name: Test
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  test-check:
    name: runner / pmd (github-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-check
          level: info
          workdir: ./testdata/subdir/
          src_path: ./

  test-pr-check:
    if: github.event_name == 'pull_request'
    name: runner / pmd (github-pr-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check
          level: warning
          workdir: ./testdata/subdir/
          src_path: ./

  test-pr-review:
    if: github.event_name == 'pull_request'
    name: runner / pmd (github-pr-review)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          level: error
          reviewdog_flags: -filter-mode=file -fail-level=any
          workdir: ./testdata/subdir/
          src_path: ./

  test-pmd7-cache:
    name: runner / pmd 7.x with cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Test PMD 7.x with cache enabled
        uses: ./
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-check
          level: info
          workdir: ./testdata/subdir/
          src_path: ./
          pmd_cache: '/tmp/pmd-cache'

  test-pmd7-bestpractices:
    name: runner / pmd 7.x bestpractices ruleset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Test PMD 7.x with category/java/bestpractices.xml
        uses: ./
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-check
          level: info
          workdir: ./testdata/subdir/
          src_path: ./
          rulesets_path: 'category/java/bestpractices.xml'
